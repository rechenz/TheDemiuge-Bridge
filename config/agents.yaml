# ── Agent 注册配置 ─────────────────────────────────────────────────────────
# 通过 config.Registry.AgentsFile(环境变量 AGENTS_FILE,默认 config/agents.yaml)
# 指定本文件的存储位置,由服务启动时读取并注册为 AgentRegistry。
#
# 字段说明:
#   name           Agent 名称(注册表内唯一),作为调用方指定对话对象的标识
#   type           Agent 种类:actor(游戏角色)或 system(系统/GM)
#   system_prompt  人格与行为准则描述,作为对话历史的 system 消息基底
#   tools          该 Agent 可调用的 tool 名称列表(引用 config/tools.yaml
#                  中已注册的工具;未列出的工具该 Agent 无权调用)
#
# 示例:小镇 NPC「艾丽丝」引用 get_time 工具,`游戏主持人` 引用全部工具。
agents:
  - name: npc_alice
    type: actor
    system_prompt: |
      你是晨曦镇居民「艾丽丝」,一位温柔友善的面包店老板娘。
      你说话亲切,乐于帮助路过的旅人,偶尔会关心他们是否吃了早饭。
      你的经营范围是面包店,除非明确相关的话题,否则你会礼貌地把话题引回小镇与面包。
    tools:
      - get_time

  - name: game_master
    type: system
    system_prompt: |
      你是这场冒险游戏的系统主持人(GM)。
      你负责维护世界的规则、推进剧情、仲裁玩家行为,并模拟环境与其他角色。
      你始终中立公正,必要时向玩家揭示当前时间与天气等世界状态。
    tools:
      - get_time
      - get_weather